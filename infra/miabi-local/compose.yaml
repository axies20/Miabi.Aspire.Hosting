# Local-only Miabi control plane for integration development.
# Pinned to a known version so tests do not silently change underneath us.
services:
  registry:
    image: registry:2
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - registry-data:/var/lib/registry
    networks: [miabi]

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: miabi
      POSTGRES_PASSWORD: ${MIABI_DB_PASSWORD:?set MIABI_DB_PASSWORD}
      POSTGRES_DB: miabi
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [miabi]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miabi"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${MIABI_REDIS_PASSWORD:?set MIABI_REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data
    networks: [miabi]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$MIABI_REDIS_PASSWORD\" ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      MIABI_REDIS_PASSWORD: ${MIABI_REDIS_PASSWORD}

  miabi:
    image: ${MIABI_IMAGE:-miabi/miabi:1.6.5}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "9000:9000"
    environment:
      MIABI_ENV: dev
      MIABI_DEV_MODE: "true"
      MIABI_PORT: "9000"
      MIABI_CORS_ORIGINS: "*"
      MIABI_DB_HOST: postgres
      MIABI_DB_PORT: "5432"
      MIABI_DB_USER: miabi
      MIABI_DB_PASSWORD: ${MIABI_DB_PASSWORD}
      MIABI_DB_NAME: miabi
      MIABI_DB_SSL_MODE: disable
      MIABI_REDIS_ADDR: redis:6379
      MIABI_REDIS_PASSWORD: ${MIABI_REDIS_PASSWORD}
      MIABI_JWT_SECRET: ${MIABI_JWT_SECRET}
      MIABI_ENCRYPTION_KEY: ${MIABI_ENCRYPTION_KEY}
      MIABI_ADMIN_EMAIL: ${MIABI_ADMIN_EMAIL:-admin@example.com}
      MIABI_ADMIN_PASSWORD: ${MIABI_ADMIN_PASSWORD}
      MIABI_API_URL: http://localhost:9000
      MIABI_WEB_URL: http://localhost:9000
      MIABI_PROXY_NETWORK: miabi
      MIABI_GOMA_PROVIDER_DIR: /etc/goma/providers
      MIABI_OPENAPI_DOCS: "true"
      MIABI_REGISTRY_ENABLED: "false"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - miabi-logs:/var/lib/miabi/logs
      - gateway-providers:/etc/goma/providers
    networks: [miabi]

  gateway:
    image: jkaninda/goma-gateway:latest
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./goma.yml:/etc/goma/goma.yml:ro
      - gateway-providers:/etc/goma/providers
    networks: [miabi]

volumes:
  registry-data:
  postgres-data:
  redis-data:
  miabi-logs:
  gateway-providers:

networks:
  miabi:
    name: miabi
